name: Build and Publish VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build and publish, for example v0.1.0'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package extension
        run: npx --yes @vscode/vsce package --allow-missing-repository --out vscode-renpy-label-tool-$env:TAG_NAME.vsix

      - name: List generated VSIX
        run: Get-ChildItem -Name vscode-renpy-label-tool-$env:TAG_NAME.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-renpy-label-tool-${{ env.TAG_NAME }}
          path: vscode-renpy-label-tool-${{ env.TAG_NAME }}.vsix
          if-no-files-found: error

      - name: Upload VSIX to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: vscode-renpy-label-tool-${{ env.TAG_NAME }}.vsix